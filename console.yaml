# ──────────────────────────────────────────────────
# LOG POINTS
# ──────────────────────────────────────────────────

DAILY_KWH:
  type: LOG
  cron: "0 0 * * *"
  entity: sensor.energy_meter_kwh
  category: E-METER
  note: "Daily kWh snapshot at midnight"

HOURLY_HUMIDITY:
  type: LOG
  cron: "0 * * * *"
  entity: sensor.living_room_humidity
  category: HVAC
  note: "Hourly humidity reading"

MAIN_PANEL_KWH:
  type: LOG
  cron: "0 * * * *"
  entity: sensor.main_panel_kwh
  category: E-METER
  target_csv: electrical_meters.csv
  note: "Main panel hourly kWh"

# ──────────────────────────────────────────────────
# ALARM POINTS — numeric_state triggers
# ──────────────────────────────────────────────────

TEMPERATURE_ALARM:
  type: ALARM
  class: "01"
  category: HVAC
  entity: sensor.network_closet_temperature
  note: "Network closet overheat"
  trigger:
    - alias: "Above 78°F for 10 min"
      platform: numeric_state
      entity_id: sensor.network_closet_temperature
      above: 78
      for:
        minutes: 10

# ──────────────────────────────────────────────────
# ALARM POINTS — state triggers (new in v2.5)
# ──────────────────────────────────────────────────

GARAGE_DOOR_OPEN:
  type: ALARM
  class: "02"
  category: SECURITY
  entity: binary_sensor.garage_door
  note: "Garage door left open"
  trigger:
    - alias: "Door open for 5 min"
      platform: state
      entity_id: binary_sensor.garage_door
      to: "on"
      for:
        minutes: 5

WASHER_FINISHED:
  type: ALARM
  class: "03"
  category: APPLIANCE
  entity: sensor.washer_status
  note: "Washer cycle complete"
  trigger:
    - alias: "Washer finished"
      platform: state
      entity_id: sensor.washer_status
      to: "complete"
      from: "running"

DEVICE_OFFLINE:
  type: ALARM
  class: "01"
  category: NETWORK
  entity: binary_sensor.server_ping
  note: "Server went offline"
  trigger:
    - alias: "Offline for 2 min"
      platform: state
      entity_id: binary_sensor.server_ping
      to: "off"
      for:
        minutes: 2

# ──────────────────────────────────────────────────
# ALARM POINTS — multi-condition AND (new in v2.5)
# ──────────────────────────────────────────────────

# Primary trigger fires only if ALL conditions are also true
HOT_AND_HUMID:
  type: ALARM
  class: "02"
  category: HVAC
  entity: sensor.server_room_temperature
  note: "Server room hot AND humid"
  trigger:
    - alias: "Temp >80 AND humidity >60% for 10 min"
      platform: numeric_state
      entity_id: sensor.server_room_temperature
      above: 80
      conditions:
        - entity_id: sensor.server_room_humidity
          above: 60
      for:
        minutes: 10

# State trigger + numeric condition
DOOR_OPEN_WHILE_HOT:
  type: ALARM
  class: "01"
  category: SECURITY
  entity: binary_sensor.server_room_door
  note: "Server room door open while overheating"
  trigger:
    - alias: "Door opened while temp >85"
      platform: state
      entity_id: binary_sensor.server_room_door
      to: "on"
      conditions:
        - entity_id: sensor.server_room_temperature
          above: 85

# Numeric trigger + state condition
POWER_HIGH_WHILE_AWAY:
  type: ALARM
  class: "02"
  category: E-METER
  entity: sensor.main_panel_watts
  note: "High power draw while nobody home"
  trigger:
    - alias: "Above 5kW while away for 15 min"
      platform: numeric_state
      entity_id: sensor.main_panel_watts
      above: 5000
      conditions:
        - entity_id: person.steven
          state: "not_home"
      for:
        minutes: 15
